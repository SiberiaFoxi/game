# ============================================================================
#  Мутанты S.T.A.L.K.E.R. — каталог (STALKER_MOD/mutants.cfg)
#
#  Секция [mutant:<Имя>]:
#   title       — имя на экране (латиница! шрифт SA не рисует кириллицу)
#   folder      — папка с model.dff + model.txd в STALKER_MOD/models/
#                 (пусто = модель не загружается из файлов)
#   modelid     -1  — слот назначит ModelLoader из свободных ped-ID;
#                 число — использовать именно этот пед-слот (например, если
#                 вы сами заменили .dff/.txd в gta3.img через IMG Tool);
#   fallback_id — пед-слот, пока основная модель не загружена (7 = male01)
#   health, damage, attack_range, attack_cooldown, aggro_radius,
#   deaggro_radius, speed_factor, night_aggro_mul — баланс боя;
#   psi_damage / psi_radius — урон в секунду вокруг (контролёр, бюрер);
#   group_min/group_max — размер стаи;
#   in_city/in_forest/in_desert/in_water/in_industrial — биомы спавна;
#   weight     — частота спавна (относительная);
#   territorial — держится у точки спавна; flees — убегает (тушканчик);
#   corpse_money — $, остающиеся на трупе (пока просто статистика).
#
#  Файловых слотов всего 23 (свободные ped-ID игры). Модели сверх этого —
#  только через замену в gta3.img + modelid=... Либо удалите ненужные
#  секции, освободив слоты.
#
#  Паки моделей (авторы и ссылки) — см. README.md, раздел «Модели».
# ============================================================================

