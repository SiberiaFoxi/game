# ============================================================================
#  S.T.A.L.K.E.R. mod — основной конфиг (STALKER_MOD/stalker_mod.cfg)
# ============================================================================

[population]
# Плотность «обычных» людей: 0.10-0.15 = 10-15% от исходного населения.
# Мир должен быть пустым и тихим — людей мало, мутантов много.
ambient_ped_multiplier = 0.12
# Сколько редких NPC фракций держать вокруг игрока (сталкеры/бандиты/военные...)
faction_humans_max = 2
no_random_cops = true
no_random_gangs = true

[mutants]
# Множитель численности мутантов (1.0 = норма Зоны)
density_multiplier = 1.0
# Спавн: дистанция от игрока
spawn_min_dist = 35
spawn_max_dist = 130
# Удаление мутантов дальше этого радиуса (ресайкл)
cull_distance = 220
# Целевая численность мутантов вокруг игрока
city_target = 6
city_night_target = 9
wild_target = 12
corpse_lifetime = 25

[missions]
# Полное отключение миссий GTA SA (сюжет, побочные, гонки, школы, угоны,
# доставки, ограбления, миссии фракций). Технически: миссионные скрипты
# (LAUNCH_MISSION) и внешние скрипты завершаются сразу после старта.
block_missions = true
# Внешние скрипты: телефонные звонки, гонки, школы и т.п.
block_external = true

[radiation]
# Доза, с которой начинается урон
damage_threshold = 60
# Урон в секунду при дозе 1000
damage_per_sec = 1.2
# Защита противогаза от радиации (0.85 = 85%)
mask_protection = 0.85
# Естественное выведение дозы в сек
natural_decay = 0.02

[anomalies]
# «Воронка» — урон за срабатывание
gravi_damage = 30
# «Электра» — урон за разряд
electro_damage = 45
# «Жарка» — урон в секунду
thermal_dps = 12
# «Кисляк» — вклад в радиационное поле
chem_rad = 1.2
# Дальность срабатывания детектора (м)
detector_range = 15

[blowout]
# Интервал между выбросами (сек): 1200-1800 = 20-30 минут
interval_min_sec = 1200
interval_max_sec = 1800
# Длительности фаз (сек)
warning_sec = 60
active_sec = 50
aftermath_sec = 15
# Урон в секунду игроку вне укрытия
damage_outside_dps = 8

[inventory]
# Максимальный переносимый вес (кг)
max_weight = 50

[keys]
# Клавиши (виртуальные коды: буквы A-Z, 13 = Enter, F9 = 0x78)
inventory = 73     # I — инвентарь
trade = 84         # T — торговля у торговца
drop = 85          # U — выбросить предмет
manual_save = 120  # F9 — вручную сохранить прогресс мода
debug_page = 121   # F10 — отладочный экран
